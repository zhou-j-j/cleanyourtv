name: CM2012 Apple V5 - All In One

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK (avoid legacy tools)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Platform 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Integrate CM2012 Apple V4 shell
        run: python3 tools/cm2012_apple/patch_controlcenter.py
      - name: Integrate uninstall, weather and aerial service
        run: python3 tools/cm2012_apple/patch_v5_features.py
      - name: Compile one APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --console=plain --stacktrace -PlauncherApplicationId=com.cm2012.applehome assembleRelease
      - name: Upload one Apple APK
        uses: actions/upload-artifact@v4
        with:
          name: CM2012-Apple-V5-AllInOne
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
