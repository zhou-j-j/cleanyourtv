name: CM2012 Apple V5.9.1 - SYSTEM HOME FONT MATCH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK (avoid legacy tools)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Platform 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Integrate CM2012 Apple V4 shell
        run: python3 tools/cm2012_apple/patch_controlcenter.py
      - name: Integrate uninstall, weather and aerial service
        run: python3 tools/cm2012_apple/patch_v5_features.py
      - name: Integrate V5.2.1 Network + App Library + Online Aerial Playlist
        run: python3 tools/cm2012_apple/patch_v52_all_in_one.py
      - name: Integrate V5.3 Wallpaper and Bluetooth
        run: python3 tools/cm2012_apple/patch_v53_wallpaper_bluetooth.py
      - name: V5.4 Pills and Phone QR MP4 Input
        run: python3 tools/cm2012_apple/patch_v54_pills_qr.py
      - name: V5.5 Icons, Bluetooth Settings and QR Fix
        run: python3 tools/cm2012_apple/patch_v55_icons_qr_bt.py        
      - name: V5.6 Quick Wi-Fi Bluetooth and focus-safe UI
        run: python3 tools/cm2012_apple/patch_v56_quick_controls.py
      - name: Validate V5.6 integration
        run: python3 tools/cm2012_apple/test_v56_quick_controls.py
      - name: Apply V5.7 link icon and simplified automatic radio lists
        run: python3 tools/cm2012_apple/patch_v57_radio_signal.py
      - name: Validate V5.7 integration
        run: python3 tools/cm2012_apple/test_v57_radio_signal.py
      - name: Add V5.8 D-pad manual refresh
        run: python3 tools/cm2012_apple/patch_v58_manual_refresh.py
      - name: Validate V5.8 manual refresh
        run: python3 tools/cm2012_apple/test_v58_manual_refresh.py
      - name: Apply V5.9 large TV layout to Wi-Fi and Bluetooth
        run: python3 tools/cm2012_apple/patch_v59_tv_readability.py
      - name: Validate V5.9 TV readability
        run: python3 tools/cm2012_apple/test_v59_tv_readability.py
      - name: Match Wi-Fi and Bluetooth text sizes to CM2012-tvOS-Settings
        run: python3 tools/cm2012_apple/patch_v591_match_tvos_fonts.py
      - name: Check V5.9.1 Wi-Fi and Bluetooth typography
        run: python3 tools/cm2012_apple/test_v591_match_tvos_fonts.py
      - name: Keep HOME registration and set system candidate label
        run: python3 tools/cm2012_apple/patch_v59_system_home.py
      - name: Validate system HOME candidate manifest
        run: python3 tools/cm2012_apple/test_v59_system_home.py
      - name: Set V5.9.1 candidate version
        run: python3 tools/cm2012_apple/patch_v591_candidate_version.py
      - name: Validate V5.9.1 candidate
        run: python3 tools/cm2012_apple/test_v591_candidate_version.py
      - name: Compile one APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --console=plain --stacktrace -PlauncherApplicationId=com.cm2012.applehome.v59system assembleRelease
      - name: Upload one Apple APK
        uses: actions/upload-artifact@v4
        with:
          name: CM2012-Apple-V5.9.1-SYSTEM-HOME-FONT-MATCH
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
