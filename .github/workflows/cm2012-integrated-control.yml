name: CM2012 Apple Home - Integrated Control Center

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Apply control center patch
        run: python3 tools/cm2012_apple/patch_controlcenter.py
      - name: Build launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --console=plain --stacktrace -PlauncherApplicationId=com.cm2012.applehome assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: CM2012-Apple-ControlCenter-Home
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
